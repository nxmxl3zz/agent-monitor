<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <title>Agent Monitor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script src="/charts.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body class="loading">
  <div class="chrome">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
        <div class="brand-text"><strong>Agent Monitor</strong><span>Codex · Claude</span></div>
      </div>
      <div class="range">
        <div class="seg" id="range" role="group" aria-label="Period">
          <button type="button" data-range="1h">1h</button><button type="button" data-range="6h">6h</button><button type="button" data-range="24h">24h</button><button type="button" data-range="7d">7d</button><button type="button" data-range="30d">30d</button>
        </div>
        <span class="range-dates num"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="range-dates">—</span></span>
      </div>
      <div class="top-actions">
        <span class="live" id="connection" role="status"><i></i><span id="connection-label">Connecting</span></span>
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
      </div>
    </header>
    <div class="filters" aria-label="Filters">
      <label class="var" id="var-provider"><span class="k">provider</span><select id="provider"><option value="all">All</option><option value="codex">Codex</option><option value="claude_code">Claude</option></select><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><button class="clear" type="button" data-clear="provider" aria-label="Clear provider filter" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></label>
      <label class="var" id="var-model"><span class="k">model</span><i class="dot" id="model-dot" hidden></i><select id="model"><option value="all">All</option></select><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><button class="clear" type="button" data-clear="model" aria-label="Clear model filter" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></label>
      <span class="updated num" id="updated"></span>
    </div>
    <p class="notice" id="notice" role="status" hidden></p>
  </div>
  <main>
    <section class="quotas" id="quotas" aria-label="Subscription quotas"></section>
    <section aria-label="Token usage">
      <div class="group-head">
        <button class="collapse" id="collapse" type="button" aria-expanded="true" aria-controls="grid"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>Token usage</button>
        <span class="group-meta" id="group-meta"></span>
      </div>
      <div class="grid" id="grid">
        <article class="panel" id="donut-panel">
          <div class="panel-head"><h2>Total tokens by model</h2><span class="hint">tap a model to filter</span><button class="icon-btn ghost" type="button" data-expand="c-donut" aria-label="Expand total by model"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg></button></div>
          <div class="chart" id="c-donut" role="img" aria-label="Token share by model"></div>
          <button class="donut-center" id="donut-center" type="button" aria-label="Show input, cache and output breakdown" aria-expanded="false" aria-controls="breakdown"></button>
          <div class="hovercard" id="breakdown" role="dialog" aria-label="Usage breakdown" hidden></div>
        </article>
        <article class="panel">
          <div class="panel-head"><h2>Token type breakdown</h2><button class="icon-btn ghost" type="button" data-expand="c-types" aria-label="Expand token type breakdown"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg></button></div>
          <div class="chart" id="c-types" role="img" aria-label="Input, cache and output per interval"></div>
        </article>
        <article class="panel">
          <div class="panel-head"><h2>Token usage by model</h2><button class="icon-btn ghost" type="button" data-expand="c-models" aria-label="Expand usage by model"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg></button></div>
          <div class="chart" id="c-models" role="img" aria-label="Tokens per interval and model"></div>
        </article>
        <article class="panel">
          <div class="panel-head"><h2>Input vs output rate</h2><span class="hint">tokens / min</span><button class="icon-btn ghost" type="button" data-expand="c-rate" aria-label="Expand input vs output rate"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg></button></div>
          <div class="chart" id="c-rate" role="img" aria-label="Average input and output tokens per minute"></div>
        </article>
      </div>
      <p class="zoom-hint" id="zoom-hint">Drag across a time chart to zoom in · double-click to reset</p>
    </section>
  </main>
  <div class="chart-dialog" id="chart-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
    <div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-btn" id="close-dialog" type="button" aria-label="Close expanded chart"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div id="expanded-chart" class="expanded-chart"></div>
  </div>
</body>
</html>
